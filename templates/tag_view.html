<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tag: #{{ tag }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  <style>
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 48px;
      height: 48px;
      background: transparent;
      border: 2px solid var(--text);
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: none;
      z-index: 1000;
      text-decoration: none;
      padding: 0;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      background: transparent;
      border: 2px solid var(--text);
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: none;
      z-index: 1001;
      padding: 0;
    }

    .container {
      padding-top: 80px;
    }

    .logo-container {
      text-align: center;
      padding: 40px 20px 20px;
      margin-bottom: 30px;
    }

    .logo-container img {
      max-width: 150px;
      height: auto;
      margin: 0 auto;
      transition: opacity 0.3s ease;
    }

    .logo-container .logo-light {
      display: block;
    }

    .logo-container .logo-dark {
      display: none;
    }

    [data-theme='dark'] .logo-container .logo-light {
      display: none;
    }

    [data-theme='dark'] .logo-container .logo-dark {
      display: block;
    }
  </style>
  <script>
    const toggleTheme = () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    };
    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
    });
  </script>
</head>
<body>
  <!-- Back Button (Floating) -->
  <a href="{{ url_for('index') }}" class="back-button" title="Back to home">←</a>

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">
      ☀
    </button>  <!-- Logo -->
  <div class="logo-container">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Bindu Logo" class="logo-light" />
    <img src="{{ url_for('static', filename='logo-dark.png') }}" alt="Bindu Logo" class="logo-dark" />
  </div>

  <div class="container">
    <h1>Tag: <span class="text-primary">#{{ tag }}</span></h1>
    {% if notes %}
      <ul class="list-group">
        {% for note_id in notes %}
          <li class="list-group-item">
            <a href="{{ url_for('note', note_name=note_id) }}" class="text-decoration-none">
              {{ note_id }}
            </a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No notes found with tag <strong>#{{ tag }}</strong>.</p>
    {% endif %}
  </div>

  <!-- Footer -->
  <footer style="background: var(--card); border-top: 1px solid var(--border); padding: 30px 20px; margin-top: 60px; text-align: center; color: var(--text); font-size: 0.9rem;">
    <p>© Vimarsha Foundation. All rights reserved.</p>
    <p><a href="https://vimarshafoundation.com" style="color: var(--text); text-decoration: none; border-bottom: 1px solid var(--text);">Visit Vimarsha Foundation</a></p>
  </footer>
</body>
</html>
