<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Note - {{ bindu_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  </head>
  <body>
    <div class="container" style="max-width:800px; margin-top:60px;">
      <div class="card card-body">
        <h2>Add Note for {{ bindu_name }}</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" placeholder="Short title for your note (optional)" />
          </div>
          <div class="mb-3">
            <label class="form-label">Note (Markdown)</label>
            <textarea name="markdown" class="form-control" rows="12" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Save Note</button>
          <a class="btn btn-secondary" href="{{ url_for('bindu', bindu_name=bindu_name) }}">Cancel</a>
        </form>
      </div>
    </div>
  </body>
</html>
