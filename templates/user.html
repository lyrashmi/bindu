<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User: {{ username }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  </head>
  <body>
    <div class="container" style="padding-top:80px; max-width:900px;">
      <a href="{{ url_for('index') }}" class="back-button">←</a>
      <h1>Author: {{ username }}</h1>
      <p>Notes created by {{ username }}:</p>
      {% if entries %}
        <ul class="list-group">
          {% for e in entries %}
            <li class="list-group-item"><a href="{{ e.link }}">{{ e.title }}</a> <small class="text-muted">({{ e.date }})</small></li>
          {% endfor %}
        </ul>
      {% else %}
        <p>No entries found.</p>
      {% endif %}
    </div>
  </body>
</html>
